# =============================================================================
# Flume Agent 配置 — 视频任务实时上传
#
# 架构:
#   [视频目录] → [Python 桥接幂等检查] → [flume_watch/*.task 文件]
#   → [Flume Spooldir Source] → [Kafka Sink] → [video_tasks topic]
#
# 组件:
#   1. Python 桥接: 监听视频目录 + 幂等检查 + 生成 .task 触发文件
#   2. Flume Spooldir: 拾取 .task 文件，读取 JSON 内容
#   3. Flume Kafka Sink: 将内容发送到 Kafka video_tasks
#   4. 成功后 Flume 自动将 .task 文件移至 flume_done/
#
# 启动步骤:
#   1. 安装 Flume (Apache Flume 1.11.0+)
#   2. 创建目录: mkdir -p flume_watch flume_done flume_failed
#   3. 启动 Python 桥接: python flume_bridge_video_watcher.py
#   4. 启动 Flume Agent: 见下方命令
# =============================================================================

videoAgent.sources = spooldirSource
videoAgent.sinks = kafkaSink
videoAgent.channels = memoryChannel

# -----------------------------------------------------------------------------
# Source: Spooldir — 监听触发文件目录
#   拾取 flume_watch/ 下的 .task 文件，读取内容作为事件体
# -----------------------------------------------------------------------------
videoAgent.sources.spooldirSource.type = spooldir
videoAgent.sources.spooldirSource.spooldir.dir = /data2/caimoyao/flume_watch
videoAgent.sources.spooldirSource.spooldir.fileSuffix = .task
videoAgent.sources.spooldirSource.spooldir.deletePolicy = never
videoAgent.sources.spooldirSource.spooldir.completedDir = /data2/caimoyao/flume_done
videoAgent.sources.spooldirSource.spooldir.failedDir = /data2/caimoyao/flume_failed
videoAgent.sources.spooldirSource.spooldir.consumeOrder = oldest
videoAgent.sources.spooldirSource.spooldir.pollDelay = 500
videoAgent.sources.spooldirSource.spooldir.pollTimeout = 1000
videoAgent.sources.spooldirSource.spooldir.recursiveSearch = false
videoAgent.sources.spooldirSource.spooldir.ignorePattern = ^[^.].*$

# -----------------------------------------------------------------------------
# Interceptor — 添加静态头信息
# -----------------------------------------------------------------------------
videoAgent.sources.spooldirSource.interceptors = staticInterceptor
videoAgent.sources.spooldirSource.interceptors.staticInterceptor.type = static
videoAgent.sources.spooldirSource.interceptors.staticInterceptor.key = source_system
videoAgent.sources.spooldirSource.interceptors.staticInterceptor.value = flume_video_watcher
videoAgent.sources.spooldirSource.interceptors.staticInterceptor.preserveExisting = true

# -----------------------------------------------------------------------------
# Channel: 内存通道
# -----------------------------------------------------------------------------
videoAgent.channels.memoryChannel.type = memory
videoAgent.channels.memoryChannel.capacity = 10000
videoAgent.channels.memoryChannel.transactionCapacity = 100

# -----------------------------------------------------------------------------
# Sink: Kafka — 发送到 video_tasks topic
#   useFlumeEventFormat=false: 直接发送文件原始内容 (JSON bytes)
#   对应消费端: json.loads(msg.value())
# -----------------------------------------------------------------------------
videoAgent.sinks.kafkaSink.type = org.apache.flume.sink.kafka.KafkaSink
videoAgent.sinks.kafkaSink.kafka.bootstrap.servers = localhost:9094
videoAgent.sinks.kafkaSink.kafka.topic = video_tasks
videoAgent.sinks.kafkaSink.kafka.flumeBatchSize = 10
videoAgent.sinks.kafkaSink.kafka.producer.acks = all
videoAgent.sinks.kafkaSink.kafka.producer.retries = 3
videoAgent.sinks.kafkaSink.kafka.producer.retry.backoff.ms = 1000
videoAgent.sinks.kafkaSink.kafka.producer.linger.ms = 100
videoAgent.sinks.kafkaSink.kafka.producer.enable.idempotence = true
videoAgent.sinks.kafkaSink.kafka.useFlumeEventFormat = false

# -----------------------------------------------------------------------------
# 绑定: Source → Channel → Sink
# -----------------------------------------------------------------------------
videoAgent.sources.spooldirSource.channels = memoryChannel
videoAgent.sinks.kafkaSink.channel = memoryChannel